name: Release

# Push a tag like v0.1.0 to publish that version to PyPI.
# Run it by hand (workflow_dispatch) to publish the current branch to TestPyPI as a dry run.
# Uses Trusted Publishing (OIDC): no API token or secret is stored anywhere.
# Model weights are not built here; they live on the separate weights-v1 GitHub Release,
# whose tag does not match "v*".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Tag must match pyproject version
        if: github.event_name == 'push'
        run: |
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Wheel ships its runtime data
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          from importlib.resources import files
          data = files('taiwan_legal_deid') / 'data'
          for name in ('tokenizer.json', 'roads_a.csv', 'tw_listed_companies.csv', 'jieba_dict_big.txt'):
              assert (data / name).is_file(), name
          "

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to TestPyPI
        if: github.event_name != 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a dry run may be repeated; TestPyPI refuses re-uploads of a version

  # Separate job so the PyPI job keeps its minimal permissions.
  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
